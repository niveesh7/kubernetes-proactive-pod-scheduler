# RBAC Configuration for Kubernetes Proactive Pod Scheduler
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proactive-scheduler-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proactive-scheduler-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/binding", "bindings"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: proactive-scheduler-binding
subjects:
  - kind: ServiceAccount
    name: proactive-scheduler-sa
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: proactive-scheduler-role
  apiGroup: rbac.authorization.k8s.io
